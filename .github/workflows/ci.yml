name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  host:
    name: Host workspace checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libudev-dev \
              mosquitto \
              mosquitto-clients \
              pkg-config \
              ripgrep
          else
            brew install mosquitto ripgrep
            echo "$(brew --prefix mosquitto)/sbin" >> "$GITHUB_PATH"
          fi

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check
        run: just check

      - name: Test local MQTT broker
        run: just mqtt-broker-test
