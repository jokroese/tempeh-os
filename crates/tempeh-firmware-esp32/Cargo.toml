[package]
name = "tempeh-firmware-esp32"
version.workspace = true
edition.workspace = true
resolver = "2"

[dependencies]
tempeh-model.workspace = true
tempeh-runtime.workspace = true
tempeh-protocol.workspace = true
anyhow.workspace = true
esp-idf-hal.workspace = true
esp-idf-svc.workspace = true
esp-idf-sys.workspace = true
embedded-svc.workspace = true
log.workspace = true

[build-dependencies]
embuild.workspace = true

[package.metadata.esp-idf-sys]
# esp-idf-sys 0.36 officially supports ESP-IDF up to v5.3.x. Paths are relative to the
# workspace root (tempeh-os/), not this crate directory.
esp_idf_version = "v5.3.3"
esp_idf_sdkconfig = "crates/tempeh-firmware-esp32/sdkconfig"
esp_idf_sdkconfig_defaults = ["crates/tempeh-firmware-esp32/sdkconfig.defaults"]
